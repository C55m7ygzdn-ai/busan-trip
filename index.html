<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小呆毛們の釜山之旅</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap');
        @font-face {
            font-family: 'Huninn';
            src: url('https://cdn.jsdelivr.net/npm/@openfonts/jf-open-huninn_traditional@1.1/files/jf-open-huninn-traditional-normal.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #F8F9FA;   /* 網站背景色：清透棉花白 */
            --line-color: #3D4852; /* 框線與文字：質感深灰藍 */
            --coral: #89C4E1;      /* 主標籤/點點：清透粉藍 */
            --yellow: #E5D5C5;     /* 亮點/標籤：暖暖奶茶色 */
            --blue: #B5D8EB;       /* Banner/卡片：粉藍天色 */
            --green: #D3E0EA;      /* 主題卡片：霧灰藍 */
            --card-bg: #FFFFFF;    /* 卡片底色：純白 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--line-color);
            font-family: 'Huninn', 'Noto Sans TC', sans-serif;
            line-height: 1.8;
            padding-bottom: 60px;
        }

        /* 頂端固定選單 */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--bg-color);
            border-bottom: 3px solid var(--line-color);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
        }

        .logo {
            font-weight: bold;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 6px;
        }

        nav a {
            text-decoration: none;
            color: var(--line-color);
            font-weight: bold;
            font-size: 0.85rem;
            padding: 3px 6px;
            border-radius: 6px;
            transition: background 0.2s;
            white-space: nowrap;
        }

        nav a:hover {
            background-color: var(--yellow);
        }

        /* 主容器 */
        .container {
            max-width: 600px;
            margin: 75px auto 20px auto;
            padding: 0 15px;
        }

        /* 通用卡片樣式 */
        .card {
            background-color: var(--card-bg);
            border: 3px solid var(--line-color);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 4px 4px 0px var(--line-color);
        }

        /* 首頁 Banner */
        .hero {
            text-align: center;
            background-color: var(--blue);
            position: relative;
            overflow: hidden;
        }

        .hero h1 {
            font-size: 1.7rem;
            margin-bottom: 5px;
        }

        .hero p {
            font-size: 0.95rem;
            margin-bottom: 15px;
        }

        .countdown-box {
            display: inline-block;
            background: var(--bg-color);
            border: 2px solid var(--line-color);
            padding: 6px 16px;
            border-radius: 16px;
            font-weight: bold;
            font-size: 0.95rem;
        }

        /* 純圖片頭像動畫與排版（無外圓框） */
        @keyframes floatLeft {
            0% { transform: translateY(0px) rotate(-3deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        @keyframes floatRight {
            0% { transform: translateY(-4px) rotate(3deg); }
            50% { transform: translateY(4px) rotate(-2deg); }
            100% { transform: translateY(-4px) rotate(3deg); }
        }

        .avatar-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin: 10px 0 15px 0;
        }

        .avatar-img-box {
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .avatar-img-box.left {
            animation: floatLeft 3.5s ease-in-out infinite;
        }

        .avatar-img-box.right {
            animation: floatRight 3.5s ease-in-out infinite;
        }

        .avatar-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(2px 3px 0px rgba(61,72,82,0.25));
        }

        .heart-icon {
            font-size: 1.5rem;
            animation: pulse 1.8s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        h2.section-title {
            font-size: 1.25rem;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 航班卡片 */
        .flight-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .flight-item {
            background: var(--bg-color);
            border: 2px solid var(--line-color);
            border-radius: 16px;
            padding: 12px;
            font-size: 0.9rem;
        }

        .flight-item h3 {
            font-size: 0.95rem;
            margin-bottom: 4px;
            color: #4A7A96;
        }

        /* 每日行程 - 日期切換 Tab */
        .day-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 15px;
            scrollbar-width: none;
        }
        .day-tabs::-webkit-scrollbar {
            display: none;
        }

        .day-tab {
            background-color: var(--bg-color);
            border: 2px solid var(--line-color);
            border-radius: 14px;
            padding: 8px 14px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            box-shadow: 2px 2px 0px var(--line-color);
        }

        .day-tab.active {
            background-color: var(--yellow);
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0px var(--line-color);
        }

        .day-content {
