<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小呆毛們の釜山之旅</title>
    
    <!-- 引入 Firebase SDK (V9 Modular Scripts via CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 你的專屬 Firebase 設定檔
        const firebaseConfig = {
            apiKey: "AIzaSyDH73-Cg-6Mhug2cksxuYbLJO5wvsTsRUE",
            authDomain: "busantrip-f2c3c.firebaseapp.com",
            databaseURL: "https://busantrip-f2c3c-default-rtdb.firebaseio.com",
            projectId: "busantrip-f2c3c",
            storageBucket: "busantrip-f2c3c.firebasestorage.app",
            messagingSenderId: "1057702270689",
            appId: "1:1057702270689:web:9ba8ff3f05a2bce54fc9a0",
            measurementId: "G-JVEW67GXR1"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);

        // 儲存日記至雲端資料庫
        window.saveDiary = function(dayNum) {
            const val1 = document.getElementById(`diary-${dayNum}-1`).value;
            const val2 = document.getElementById(`diary-${dayNum}-2`).value;

            set(ref(database, `diaries/day_${dayNum}`), {
                user1: val1,
                user2: val2,
                updatedAt: new Date().toISOString()
            }).then(() => {
                alert(`Day ${dayNum} 的小日記已儲存並同步至雲端！✨`);
            }).catch((error) => {
                alert("儲存失敗，請檢查網路連線！");
                console.error(error);
            });
        };

        // 即時監聽雲端資料庫變更（兩支手機隨時自動同步）
        const diaryRef = ref(database, 'diaries');
        onValue(diaryRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                for (let i = 1; i <= 9; i++) {
                    if (data[`day_${i}`]) {
                        const diary1 = document.getElementById(`diary-${i}-1`);
                        const diary2 = document.getElementById(`diary-${i}-2`);
                        
                        // 僅在使用者未聚焦輸入時自動更新，避免打字打到一半被覆蓋
                        if (diary1 && document.activeElement !== diary1) {
                            diary1.value = data[`day_${i}`].user1 || '';
                        }
                        if (diary2 && document.activeElement !== diary2) {
                            diary2.value = data[`day_${i}`].user2 || '';
                        }
                    }
                }
            }
        });
    </script>
